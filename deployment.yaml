---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql
  template:
    metadata:
      labels:
        app: sql
    spec:
      containers:
      - name: sql-container
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_SA_PASSWORD
          value: "Qwerty-1"
        ports:
        - containerPort: 1433
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bek-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bek
  template:
    metadata:
      labels:
        app: bek
    spec:
      containers:
      - name: bek-container
        image: sasha22mk/test-site:bek
        ports:
        - containerPort: 5034
---
apiVersion: v1
kind: Service
metadata:
  name: bek-service
spec:
  selector:
    app: bek
  ports:
  - protocol: TCP
    port: 5034
    targetPort: 5034
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
      - name: front-container
        image: sasha22mk/test-site:front
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: front-service
spec:
  selector:
    app: front
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
